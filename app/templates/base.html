<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Observatório de Dados{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar"><div class="container-fluid shell d-flex align-items-center justify-content-between py-3">
    <a class="brand text-decoration-none" href="{{ url_for('index') }}"><span class="brand-mark">◈</span> OBSERVATÓRIO<span class="brand-muted">/ dados</span></a>
    <nav class="top-links"><a href="{{ url_for('index') }}">Vendas</a><a href="{{ url_for('laboratory') }}">Laboratório financeiro</a></nav>
  </div></header>
  <main class="container-fluid shell py-4 py-lg-5">{% block content %}{% endblock %}</main>
  <footer class="container-fluid shell pb-4"><div class="footer-line">Projeto de análise de dados · Demonstração educativa · Igor Mota</div></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
